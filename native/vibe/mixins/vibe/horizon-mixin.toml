[mod]
id = "vibe"
version = "1.0.0-beta.1"
priority = 100

# Tested on this Horizon nightly. The bundle only uses named hook points
# (compatibility.json "hooks": 44), so the launcher can build it on any later
# Horizon that still has them.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The mod's logic and state, added to the game as `crate::game::vibe`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "vibe"
source = "runtime.rs"

# Start Vibe's JVM sidecar when a world opens, so the JVM is not kept alive
# while the player sits in the menu.
[[injection]]
id = "server-start"
hook = "server_about_to_start"
hook_version = 1
kind = "HEAD"
helper = "server_start.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dedicated", ty = "bool", value = "dedicated" },
]

[[injection]]
id = "server-stop"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "server_stop.rs"
bindings = [
  { name = "dedicated", ty = "bool", value = "dedicated" },
]

# `/vibe ...` in chat, before the server or Horizon sees it.
[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Make the chat box complete and colour `/vibe`.
[[injection]]
id = "commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

# The mod's row in Options > Mods.
[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
