# Vibe compatibility database.
#
# Every entry states what was actually tested. Statuses:
#   FULL          all tested features work
#   HIGH          most tested features work
#   PARTIAL       some tested features work
#   CONTENT_ONLY  only compatible data/assets are available
#   BLOCKED       cannot currently run
#   UNKNOWN       not sufficiently tested
#
# Fixture entries are clean-room jars built by this repository, not third-party
# mods. Third-party entries stay UNKNOWN until a real jar has been tested in a
# real environment; do not promote them from inspection alone.

schema = 1

[[entries]]
